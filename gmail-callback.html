<!DOCTYPE html>
<html>
<head>
  <title>Gmail Authorization</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      margin: 0;
    }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Processing Authorization...</h2>
    <p id="message">Please wait while we complete your Gmail connection.</p>
  </div>
  <script>
    // Get authorization code from URL
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    
    const spinner = document.getElementById('spinner');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    
    if (error) {
      spinner.style.display = 'none';
      title.className = 'error';
      title.textContent = 'Authorization Failed';
      message.textContent = error === 'access_denied' 
        ? 'You declined the authorization request.' 
        : 'An error occurred during authorization.';
    } else if (code) {
      // Send code to opener window
      if (window.opener) {
        window.opener.postMessage({ type: 'GMAIL_AUTH_SUCCESS', code }, '*');
        title.className = 'success';
        title.textContent = 'Authorization Successful!';
        message.textContent = 'You can close this window now.';
        spinner.style.display = 'none';
        
        // Auto-close after 2 seconds
        setTimeout(() => window.close(), 2000);
      } else {
        title.textContent = 'Completing Authorization...';
        message.textContent = 'Please wait while we finalize your connection.';
      }
    } else {
      spinner.style.display = 'none';
      title.className = 'error';
      title.textContent = 'Invalid Request';
      message.textContent = 'No authorization code found.';
    }
  </script>
</body>
</html>
